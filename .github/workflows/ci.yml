name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relayboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relayboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relayboard?schema=public
      JWT_SECRET: ci-test-secret-only-not-used-in-production

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply database migrations
        run: npm run prisma:migrate
      - name: Run integration tests
        run: npm test
