services:
  db:
    image: postgres:13-alpine
    container_name: relayboard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relayboard
    ports:
      - "5432:5432"
    volumes:
      - relayboard-postgres-data:/var/lib/postgresql/data

volumes:
  relayboard-postgres-data:
